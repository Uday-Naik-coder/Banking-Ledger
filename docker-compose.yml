version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: udaynaik07/banking-ledger:latest
    container_name: banking-ledger-app
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: banking-ledger-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
